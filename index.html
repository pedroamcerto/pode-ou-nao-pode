<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A3CD1">
<meta name="description" content="Pode ou Não Pode? Situações do dia a dia, voto da galera e o que a Bíblia diz. Célula Aquila.">
<title>Pode ou Não Pode? — Aquila</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600;700;800&display=swap">
<style>
:root{
  --azul:#1A3CD1;
  --azul-noite:#0F2687;
  --tinta:#0B1026;
  --papel:#FFFFFF;
  --ouro:#F5E52E;
  --pode:#34C27A;
  --nao:#C61F32;
  --texto-suave:#DCE3FF;
  --texto-mudo:#B9C6FF;
  --cinza-texto:#4A5170;
  --campo:#F4F6FC;
  --erro:#B3192B;
  --ref-bg:#E3E9FF; --ref-fg:#0F2687;
  --blush:#F4A3B5;
  --gutter:clamp(16px,5vw,20px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--azul);color:var(--papel);font-family:Jost,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
#app{min-height:100vh;min-height:100dvh;overflow-x:hidden;overflow-x:clip}
button,input{font-family:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--ouro);outline-offset:3px}
a{color:var(--azul)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- estrutura ---------- */
.screen{position:relative;max-width:440px;margin:0 auto;min-height:100vh;min-height:100dvh;
  padding:calc(20px + env(safe-area-inset-top)) var(--gutter) calc(28px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column}
.screen > :not(.mascot){position:relative;z-index:1}
.mascot{position:absolute;z-index:0;pointer-events:none;display:block}
.push{margin-top:auto}

.top{display:flex;align-items:center;justify-content:space-between;height:32px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;color:var(--papel)}
.brand svg{height:18px;width:40px;display:block}
.brand span{font-weight:800;font-size:13px;letter-spacing:.32em}
.top-meta{font-weight:600;font-size:11px;letter-spacing:.2em;opacity:.75}
.top-count{font-weight:800;font-size:13px;letter-spacing:.16em;white-space:nowrap}
.top-count span{color:var(--texto-mudo)}
.badge{display:flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:14px;background:var(--ouro);color:var(--tinta);font-weight:800;font-size:11px;letter-spacing:.14em}

.label{font-weight:800;font-size:13px;letter-spacing:.2em}
.label-sm{font-weight:800;font-size:12px;letter-spacing:.24em;color:var(--texto-suave)}
.row-between{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.muted{font-weight:600;font-size:14px;color:var(--texto-suave)}

/* ---------- cartas ---------- */
.card{background:var(--papel);color:var(--tinta);border:3px solid var(--tinta);border-radius:20px;box-shadow:6px 6px 0 var(--tinta)}
.back{background:var(--azul-noite);border:3px solid var(--tinta);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--ouro)}
.back::before{content:"";position:absolute;inset:9px;border:2px solid rgba(245,229,46,.55);border-radius:13px}
.back svg{width:104px;height:47px;display:block}
.back b{font-weight:800;font-size:13px;letter-spacing:.16em;text-align:center;line-height:1.15}

/* ---------- botões ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 18px;border:3px solid var(--tinta);border-radius:14px;
  font-weight:800;font-size:16px;letter-spacing:.2em;text-transform:uppercase;transition:transform .12s, box-shadow .12s}
.btn-dark{background:var(--tinta);color:var(--ouro)}
.btn-dark:disabled{opacity:.55}
.btn-sec{background:var(--papel);color:var(--tinta);box-shadow:4px 4px 0 var(--tinta);font-size:15px;letter-spacing:.14em}
.btn-sec:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--tinta)}
.btn-dark:not(:disabled):active{transform:translateY(1px)}
.btn svg{flex:0 0 auto}
.btn-big{min-height:60px;font-size:17px}

/* ---------- início ---------- */
.title{margin:34px 0 0;font-weight:800;font-size:68px;line-height:.94;letter-spacing:.05em;display:flex;flex-direction:column}
.title .ou{color:var(--ouro)}
.sub{margin:16px 0 0;font-weight:500;font-size:16px;line-height:1.4;max-width:250px;color:var(--texto-suave)}
.form{margin-top:22px;padding:18px;display:flex;flex-direction:column;gap:8px}
.form label{font-weight:800;font-size:12px;letter-spacing:.18em}
.form label + input{margin-bottom:0}
.form .l2{margin-top:10px}
.field{height:52px;width:100%;border:2.5px solid var(--tinta);border-radius:12px;padding:0 14px;font-size:17px;font-weight:500;color:var(--tinta);background:var(--campo)}
.field::placeholder{color:#8A90A8;opacity:1}
.field:focus-visible{outline:3px solid var(--ouro);outline-offset:1px;border-color:var(--azul)}
.field.bad{border-color:var(--nao)}
.code-row{display:flex;gap:10px}
.code-row .field{width:0;flex:1 1 auto;font-size:22px;font-weight:800;letter-spacing:.4em;text-transform:uppercase}
.code-row .field::placeholder{letter-spacing:.4em;font-weight:700}
.code-row .btn{min-height:52px;height:52px;border-radius:12px;font-size:15px;letter-spacing:.16em;padding:0 20px}
.err{display:flex;align-items:center;gap:8px;color:var(--erro);font-weight:600;font-size:14px;line-height:1.3}
.err:empty{display:none}
.err svg{flex:0 0 auto}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0 14px;color:var(--texto-suave);font-weight:600;font-size:12px;letter-spacing:.2em}
.divider i{flex:1 1 auto;height:2px;background:rgba(255,255,255,.28)}

/* ---------- mini cartas do código ---------- */
.code{display:flex;gap:8px}
.code span{width:54px;height:66px;background:var(--papel);color:var(--tinta);border:3px solid var(--tinta);border-radius:10px;box-shadow:3px 3px 0 var(--tinta);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:32px}
.code.tilt span:nth-child(1){transform:rotate(-3deg)}
.code.tilt span:nth-child(2){transform:rotate(2deg)}
.code.tilt span:nth-child(3){transform:rotate(-1deg)}
.code.tilt span:nth-child(4){transform:rotate(3deg)}
.code.sm span{height:64px;font-size:30px}
.code-xs{display:flex;align-items:center;gap:8px;font-weight:600;font-size:12px;letter-spacing:.16em;color:var(--texto-suave)}
.code-xs .code{gap:3px}
.code-xs .code span{width:20px;height:24px;border-width:2px;border-radius:5px;box-shadow:none;font-size:13px}

/* ---------- conectando ---------- */
.center{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;perspective:900px}
.spin-wrap{position:relative;width:170px;height:236px}
.spin-wrap .under{position:absolute;inset:0;background:var(--papel);border:3px solid var(--tinta);border-radius:20px;transform:rotate(8deg) translate(14px,6px);opacity:.9}
.spin-wrap .back{position:absolute;inset:0;box-shadow:6px 6px 0 var(--tinta)}
.spin{animation:aqFlip 2.4s cubic-bezier(.6,0,.3,1) infinite}
@keyframes aqFlip{0%{transform:rotateY(0deg) rotate(-4deg)}50%{transform:rotateY(180deg) rotate(4deg)}100%{transform:rotateY(360deg) rotate(-4deg)}}
.big-label{font-weight:800;font-size:22px;letter-spacing:.12em;text-align:center}
.dots{display:flex;align-items:center;gap:6px;font-weight:500;font-size:15px;color:var(--texto-suave)}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--ouro);animation:aqDot 1.2s infinite}
.dots i:nth-of-type(2){animation-delay:.2s}
.dots i:nth-of-type(3){animation-delay:.4s}
@keyframes aqDot{0%,80%,100%{opacity:.25}40%{opacity:1}}
.foot{text-align:center;font-weight:500;font-size:13px;color:var(--texto-mudo);padding-bottom:8px}

/* ---------- lobby ---------- */
.code-block{margin-top:20px;display:flex;align-items:flex-end;justify-content:space-between}
.code-block > div{display:flex;flex-direction:column;gap:10px}
.qr-card{margin-top:22px;padding:16px;display:flex;align-items:center;gap:16px}
.qr{width:132px;height:132px;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.qr img,.qr canvas{width:132px!important;height:132px!important;display:block;image-rendering:pixelated}
.qr-txt{display:flex;flex-direction:column;gap:8px;min-width:0}
.qr-txt b{font-weight:800;font-size:13px;letter-spacing:.16em}
.qr-txt span{font-weight:500;font-size:14px;line-height:1.35;color:var(--cinza-texto)}
.qr-txt a{font-weight:700;font-size:14px;line-height:1.3;word-break:break-all;color:var(--azul)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.seg{margin-top:10px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.seg button{min-height:48px;border:2.5px solid var(--tinta);border-radius:12px;background:var(--azul-noite);color:var(--texto-suave);font-weight:800;font-size:15px;letter-spacing:.08em;transition:transform .12s;padding:0 2px}
@media (max-width:399px){ .seg{gap:6px} .seg button{font-size:13px;letter-spacing:.02em;padding:0} }
.seg button[aria-pressed="true"]{background:var(--ouro);color:var(--tinta);box-shadow:3px 3px 0 var(--tinta);transform:translate(-1px,-1px)}
.chip{display:flex;align-items:center;gap:6px;height:38px;padding:0 14px;border:2.5px solid var(--tinta);border-radius:19px;background:var(--papel);color:var(--tinta);font-weight:600;font-size:15px;max-width:100%}
.chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.host{font-weight:700}
.chip.me{background:var(--ouro);font-weight:700}
.chip svg{flex:0 0 auto}
.tip{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:14px;background:var(--azul-noite);color:var(--texto-suave);font-weight:500;font-size:14px;line-height:1.35}
.tip svg{flex:0 0 auto;margin-top:1px}
.hint{margin:0;text-align:center;font-weight:500;font-size:14px;color:var(--texto-mudo);line-height:1.35}
.stack3{position:relative;width:210px;height:290px}
.stack3 .back{position:absolute;inset:0;border-radius:22px}
.stack3 .back::before{inset:10px;border-radius:14px}
.stack3 .b1{transform:rotate(-9deg) translate(-18px,8px)}
.stack3 .b2{transform:rotate(6deg) translate(16px,4px)}
.stack3 .b3{box-shadow:6px 6px 0 var(--tinta);gap:16px}
.stack3 .b3 svg{width:128px;height:58px}
.stack3 .b3 b{font-size:16px}

/* ---------- votação ---------- */
.progress{margin-top:12px;height:6px;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden}
.progress i{display:block;height:6px;background:var(--ouro);transition:width .4s}
.deck{margin-top:26px;position:relative;padding:0 8px 8px}
.deck .s1,.deck .s2{position:absolute;left:14px;right:14px;border:3px solid var(--tinta);border-radius:20px}
.deck .s1{top:6px;bottom:0;background:var(--azul-noite);transform:rotate(-5deg)}
.deck .s2{top:2px;bottom:4px;background:var(--papel);transform:rotate(3.5deg)}
.qcard{position:relative;min-height:288px;padding:20px 22px 84px;display:flex;flex-direction:column;transform:rotate(-1.5deg)}
.qcard .qhead{display:flex;align-items:center;justify-content:space-between}
.qnum{font-weight:800;font-size:12px;letter-spacing:.24em;color:var(--azul)}
.qcard .ink{height:14px;width:31px;color:var(--tinta);opacity:.85;display:block}
.qtext{margin:22px 0 0;font-weight:700;font-size:clamp(22px,6.6vw,27px);line-height:1.18;letter-spacing:-.005em}
.qcard .mascot{right:10px;bottom:8px;width:74px;height:74px;transform:rotate(-8deg)}
.deal{animation:aqDeal .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes aqDeal{0%{transform:translate(160px,-260px) rotate(24deg);opacity:0}70%{opacity:1}100%{transform:translate(0,0) rotate(-1.5deg);opacity:1}}
.votes{margin-top:22px;display:flex;flex-direction:column;gap:10px}
.votes .note{font-weight:500;font-size:13px;color:var(--texto-mudo)}
.vchip{display:flex;align-items:center;gap:5px;height:32px;padding:0 11px 0 7px;border:2px solid var(--tinta);border-radius:16px;background:var(--papel);color:var(--tinta);font-weight:600;font-size:14px;max-width:100%}
.vchip.wait{border:2px dashed rgba(255,255,255,.6);background:transparent;color:var(--texto-suave)}
.vchip.me{background:var(--ouro)}
.vchip.wait.me{background:transparent;border-color:var(--ouro);color:var(--ouro)}
.vchip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vchip svg{flex:0 0 auto}
.status{margin:20px 0 0;text-align:center;font-weight:600;font-size:15px;color:var(--papel)}
.status.ok{color:var(--ouro)}
.hand-row{margin-top:22px;display:flex;gap:14px;padding:0 4px}
.hand{flex:1 1 0;min-width:0;height:132px;border:3px solid var(--tinta);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  box-shadow:4px 4px 0 var(--tinta);transition:transform .22s cubic-bezier(.2,.8,.2,1),opacity .22s,box-shadow .22s;padding:0 6px}
.hand .ic{width:46px;height:46px;border-radius:23px;display:flex;align-items:center;justify-content:center}
.hand .tx{font-weight:800;font-size:clamp(16px,4.9vw,19px);letter-spacing:.16em;white-space:nowrap}
.hand.p{background:var(--pode);color:var(--tinta);transform:rotate(-3deg)}
.hand.p .ic{background:var(--tinta)}
.hand.n{background:var(--nao);color:var(--papel);transform:rotate(3deg)}
.hand.n .ic{background:var(--papel)}
.hand.picked{box-shadow:6px 8px 0 var(--tinta)}
.hand.p.picked{transform:translateY(-14px) rotate(-3deg)}
.hand.n.picked{transform:translateY(-14px) rotate(3deg)}
.hand.dim{opacity:.45}
.hand.p.dim{transform:translateY(8px) scale(.96) rotate(-3deg)}
.hand.n.dim{transform:translateY(8px) scale(.96) rotate(3deg)}
.vote-actions{margin-top:auto;padding-top:28px}
.vote-actions .btn{width:100%}

/* ---------- revelação ---------- */
.reveal-grid{display:flex;flex-direction:column}
.rcard{margin-top:24px;overflow:hidden;display:flex;flex-direction:column}
.flip{animation:aqReveal .7s cubic-bezier(.3,.7,.2,1) both;backface-visibility:hidden;-webkit-backface-visibility:hidden}
@keyframes aqReveal{0%{transform:perspective(1100px) rotateY(180deg)}100%{transform:perspective(1100px) rotateY(0deg)}}
.banner{border-bottom:3px solid var(--tinta);padding:16px 20px;display:flex;align-items:center;gap:12px}
.banner.n{background:var(--nao);color:var(--papel)}
.banner.p{background:var(--pode);color:var(--tinta)}
.banner .ic{width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.banner.n .ic{background:var(--papel)}
.banner.p .ic{background:var(--tinta)}
.banner.d{background:var(--ouro);color:var(--tinta)}
.banner.d .ic{background:var(--tinta)}
.banner b{font-weight:800;font-size:30px;letter-spacing:.12em;line-height:1}
.banner b.long{font-size:clamp(20px,6vw,26px);letter-spacing:.08em;line-height:1.05}
.rbody{padding:18px 20px 20px;display:flex;flex-direction:column;gap:14px}
.rq{display:flex;flex-direction:column;gap:6px}
.rq .qnum{font-size:11px}
.rq span:last-child{font-weight:600;font-size:16px;line-height:1.3;color:var(--cinza-texto)}
.exp{margin:0;font-weight:500;font-size:17px;line-height:1.45}
.refs{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.refs button,.vtabs button{min-height:36px;display:flex;align-items:center;gap:6px;padding:0 12px;border:2px solid transparent;border-radius:18px;background:var(--ref-bg);color:var(--ref-fg);font-weight:700;font-size:14px;white-space:nowrap}
.refs button:hover{border-color:var(--ref-fg)}
.refs button svg{opacity:.7}
.refs-hint{margin:-6px 0 0;font-weight:500;font-size:13px;color:var(--cinza-texto)}

/* ---------- painel de versículos ---------- */
.sheet{padding:0;border:3px solid var(--tinta);border-bottom:0;border-radius:20px 20px 0 0;background:var(--papel);color:var(--tinta);
  width:100%;max-width:440px;max-height:82vh;max-height:82dvh;margin:auto auto 0;box-shadow:0 -6px 0 rgba(11,16,38,.25)}
.sheet[open]{display:flex;flex-direction:column;overflow:hidden;animation:aqSheet .28s cubic-bezier(.2,.8,.2,1)}
.sheet::backdrop{background:rgba(11,16,38,.6)}
@keyframes aqSheet{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet-head{padding:10px 18px 12px;border-bottom:2.5px solid var(--tinta);display:flex;flex-direction:column;gap:10px}
.sheet-grip{align-self:center;width:44px;height:5px;border-radius:3px;background:#C9CEDF}
.sheet-title{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet-title h2{margin:0;font-weight:800;font-size:20px;letter-spacing:.06em}
.sheet-close{width:44px;height:44px;flex:0 0 auto;border:2.5px solid var(--tinta);border-radius:22px;background:var(--papel);display:flex;align-items:center;justify-content:center}
.vtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px 2px}
.vtabs button[aria-selected="true"]{background:var(--tinta);color:var(--ouro)}
.sheet-body{padding:16px 20px;overflow-y:auto;flex:1 1 auto;min-height:0;-webkit-overflow-scrolling:touch}
.sheet-body p{margin:0 0 12px;font-weight:500;font-size:18px;line-height:1.5}
.sheet-body sup{font-weight:800;font-size:12px;color:var(--azul);margin-right:4px}
.sheet-body .msg{color:var(--cinza-texto);font-size:16px}
.sheet-foot{padding:12px 18px calc(14px + env(safe-area-inset-bottom));border-top:2px solid #E3E6F0;display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet-foot small{font-weight:500;font-size:12px;line-height:1.3;color:var(--cinza-texto)}
.sheet-foot a{flex:0 0 auto;min-height:44px;display:flex;align-items:center;gap:8px;padding:0 14px;border:2.5px solid var(--tinta);border-radius:12px;background:var(--papel);color:var(--tinta);box-shadow:3px 3px 0 var(--tinta);font-weight:800;font-size:13px;letter-spacing:.12em;text-decoration:none}
@media (min-width:600px){ .sheet{margin:auto;border-bottom:3px solid var(--tinta);border-radius:20px;box-shadow:6px 6px 0 var(--tinta)} .sheet-grip{display:none} }
@media (prefers-reduced-motion: reduce){ .sheet[open]{animation:none} }
.talk{margin-top:4px;background:var(--ouro);border:2.5px solid var(--tinta);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.talk b{display:flex;align-items:center;gap:8px;font-weight:800;font-size:12px;letter-spacing:.22em}
.talk span{font-weight:600;font-size:16px;line-height:1.35}
.result{margin-top:28px;display:flex;flex-direction:column;gap:12px}
.bars{display:grid;grid-template-columns:104px minmax(0,1fr) 28px;align-items:center;gap:10px}
.bars .bl{display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px;letter-spacing:.12em;white-space:nowrap}
.track{height:28px;border:2.5px solid var(--tinta);border-radius:8px;background:var(--papel);overflow:hidden}
.track i{display:block;height:100%;transform-origin:left center}
.track i.on{border-right:2.5px solid var(--tinta)}
.track .fp{background:var(--pode)}
.track .fn{background:var(--nao)}
.grow{animation:aqGrow .6s .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes aqGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bars .num{font-weight:800;font-size:20px;text-align:right}
.spark{display:flex;align-items:flex-start;gap:10px;margin-top:4px;padding:12px 14px;border-radius:14px;border:2.5px dashed rgba(245,229,46,.7);color:var(--papel);font-weight:600;font-size:15px;line-height:1.35}
.spark svg{flex:0 0 auto;margin-top:1px}
.reveal-actions{margin-top:28px;display:flex;flex-direction:column;gap:12px}
.talk-now{margin-top:24px;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;background:var(--azul-noite);color:var(--texto-suave);font-weight:600;font-size:16px;line-height:1.35}
.talk-now svg{flex:0 0 auto}

/* ---------- fim ---------- */
.end-wrap{margin-top:52px;position:relative;padding:0 10px}
.end-wrap .s1,.end-wrap .s2{position:absolute;left:22px;right:22px;border:3px solid var(--tinta);border-radius:22px}
.end-wrap .s1{top:10px;bottom:-6px;background:var(--azul-noite);transform:rotate(-6deg)}
.end-wrap .s2{top:6px;bottom:-2px;background:var(--ouro);transform:rotate(4deg)}
.end-card{position:relative;border-radius:22px;padding:24px 24px 28px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.end-card .pet{width:128px;height:128px;display:block}
.end-card h1{margin:0;font-weight:800;font-size:40px;line-height:1;letter-spacing:.06em}
.end-card .bar{display:block;width:48px;height:5px;background:var(--azul)}
.end-card .pray{margin:0;font-weight:600;font-size:20px;line-height:1.3}
.end-card .sum{margin:0;font-weight:500;font-size:15px;line-height:1.4;color:var(--cinza-texto);max-width:250px}
.end-actions{margin-top:auto;padding-top:32px;display:flex;flex-direction:column;gap:12px}

/* ---------- telas largas (notebook / TV) ---------- */
@media (min-width:900px){
  .screen.wide{max-width:960px}
  .screen.wide .reveal-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:44px;align-items:start}
  .screen.wide .side{position:sticky;top:24px}
  .screen.wide .result{margin-top:24px}
}
@media (max-width:379px){
  .opt{display:none}
  .title{font-size:62px}
  .bars{grid-template-columns:96px minmax(0,1fr) 26px;gap:8px}
}

@media (prefers-reduced-motion: reduce){
  .spin,.dots i,.deal,.flip,.grow{animation:none!important}
  .hand,.btn,.progress i{transition:none!important}
}
</style>
</head>

<script>
/* =====================================================================
   BARALHO — edite à vontade. Formato: { q, heat:1|2|3, a:true|false|null, tag?, exp, ref, conversa }
   heat = quanto a carta racha a roda (3 = muito polêmica, sai mais vezes; 1 = mais tranquila)
   a:true = PODE (verde) · a:false = NÃO PODE (vermelho) · a:null = DEPENDE (amarelo, pra temas em que cristãos sinceros divergem)
   ===================================================================== */
const DECK = [
  { q:"Contar uma mentirinha pra não magoar alguém.", heat:3, a:false,
    exp:"A Bíblia pede verdade com amor. Dá pra ser gentil e cuidadoso sem inventar nada: escolher bem as palavras não é o mesmo que mentir.",
    ref:"Ef 4:15,25 · Cl 3:9",
    conversa:"Quando foi a última vez que você achou mais fácil mentir do que falar a verdade com jeito?" },
  { q:"Ficar com raiva de alguém.", heat:2, a:true, tag:"Pode (sem pecar)",
    exp:"Sentir raiva não é pecado em si. O problema é o que a gente faz com ela e deixar ela durar até virar mágoa.",
    ref:"Ef 4:26-27",
    conversa:"O que te ajuda a esfriar a cabeça antes de agir com raiva?" },
  { q:"Não perdoar alguém, mas também não fazer nada contra a pessoa.", heat:2, a:false,
    exp:"Rancor em silêncio continua sendo falta de perdão. Perdoar é soltar a dívida, não só evitar a vingança.",
    ref:"Mt 6:14-15 · Cl 3:13",
    conversa:"Qual a diferença entre perdoar e confiar de novo na pessoa?" },
  { q:"Pagar imposto mesmo achando o governo corrupto.", heat:2, a:true, tag:"Pode (e deve)",
    exp:"Jesus e Paulo mandaram pagar impostos sob o Império Romano, que estava longe de ser justo. Cumprir o dever não é apoiar o erro.",
    ref:"Mt 22:21 · Rm 13:6-7",
    conversa:"Onde mais a gente deixa de fazer o certo porque \"o sistema também não faz\"?" },
  { q:"Comentar os defeitos de alguém pelas costas, mesmo sendo tudo verdade.", heat:2, a:false,
    exp:"Ser verdade não transforma fofoca em coisa boa. Se não edifica e a pessoa não está ali pra se defender, não é conversa, é fofoca.",
    ref:"Pv 16:28 · Tg 4:11 · Ef 4:29",
    conversa:"Como sair de uma roda de fofoca sem ficar chato?" },
  { q:"Questionar Deus e desabafar com Ele quando a vida tá difícil.", heat:2, a:true,
    exp:"Os Salmos estão cheios de perguntas sinceras pra Deus, e o próprio Jesus clamou na cruz usando um deles. Desabafar com Deus também é fé.",
    ref:"Sl 13 · Sl 22:1 · Mt 27:46",
    conversa:"Você se sente à vontade pra ser sincero com Deus quando tá mal?" },
  { q:"Levar umas canetas e folhas da empresa pra casa.", heat:2, a:false,
    exp:"Pegar o que não é seu é roubo, seja uma caneta ou um notebook. Quem é fiel no pouco aprende a ser fiel no muito, e isso vale mesmo quando ninguém tá olhando.",
    ref:"Ef 4:28 · Lc 16:10",
    conversa:"Em que situação a gente costuma achar que \"coisa pequena não conta\"?" },
  { q:"Ficar com o troco que o caixa te deu a mais.", heat:1, a:false,
    exp:"Honestidade vale mesmo quando o erro foi do outro. Aquele dinheiro vai fazer falta pra alguém no fim do dia.",
    ref:"Pv 11:1 · Pv 20:23",
    conversa:"Já devolveu algo que ninguém ia perceber? Como foi?" },
  { q:"Ajudar alguém que te fez mal.", heat:1, a:true, tag:"Pode (e deve)",
    exp:"Amar o inimigo é um dos ensinos centrais de Jesus. Fazer o bem pra quem te feriu é vencer o mal com o bem.",
    ref:"Lc 6:27-28 · Rm 12:20-21",
    conversa:"O que torna tão difícil fazer o bem pra quem te machucou?" },
  { q:"Revidar quando alguém te ofende.", heat:1, a:false,
    exp:"A vingança pertence a Deus. Dá pra se posicionar e colocar limite sem devolver na mesma moeda.",
    ref:"Rm 12:17-19 · Mt 5:38-39",
    conversa:"Qual a diferença entre se defender e revidar?" },
  { q:"Comer carne de porco.", heat:2, a:true,
    exp:"Jesus declarou todos os alimentos puros, e Pedro recebeu a mesma mensagem numa visão. Comida não aproxima nem afasta ninguém de Deus.",
    ref:"Mc 7:18-19 · At 10:15 · Cl 2:16",
    conversa:"Que regras a gente às vezes coloca acima do que importa de verdade?" },
  { q:"Ter amizade próxima com quem não é cristão.", heat:3, a:true,
    exp:"Jesus andava com pecadores e era chamado de amigo deles. Só vale ficar atento a quem está influenciando quem.",
    ref:"Mc 2:15-17 · Mt 5:13-16 · 1Co 15:33",
    conversa:"Seus amigos de fora da igreja veem diferença em você?" },
  { q:"Fazer caridade principalmente pra ser visto e elogiado.", heat:2, a:false,
    exp:"Jesus disse que quem faz o bem pra aparecer já recebeu a recompensa: o aplauso. O bem que agrada a Deus não precisa de plateia.",
    ref:"Mt 6:1-4",
    conversa:"Postar uma boa ação é sempre errado? Onde fica o limite?" },
  { q:"Colar na prova quando ninguém vai descobrir.", heat:1, a:false,
    exp:"Integridade é o que a gente faz quando ninguém está vendo. Fazer tudo como pra Deus inclui a prova.",
    ref:"Pv 10:9 · Cl 3:23",
    conversa:"Em que área da sua vida é mais fácil ser uma pessoa quando ninguém tá olhando?" },
  { q:"Tirar um dia pra descansar sem fazer nada \"produtivo\".", heat:1, a:true,
    exp:"Descanso foi ideia de Deus desde a criação. Jesus também chamava os discípulos pra descansar. Parar não é preguiça.",
    ref:"Êx 20:8-10 · Mc 6:31 · Sl 127:2",
    conversa:"Você sente culpa quando descansa? Por quê?" },
  { q:"Chorar e ficar triste mesmo tendo fé.", heat:1, a:true,
    exp:"Jesus chorou no túmulo de Lázaro, sabendo que ia ressuscitá-lo. Fé não apaga a tristeza, só muda a esperança.",
    ref:"Jo 11:35 · Rm 12:15 · 1Ts 4:13",
    conversa:"Como a gente pode chorar junto com alguém sem tentar consertar tudo?" },
  { q:"Desrespeitar os pais porque eles \"não entendem nada\".", heat:1, a:false,
    exp:"Honrar não depende de concordar. Dá pra discordar com respeito, e esse é o único mandamento que vem com promessa.",
    ref:"Êx 20:12 · Ef 6:1-3",
    conversa:"Como honrar os pais quando a relação é difícil?" },
  { q:"Julgar alguém pelo pecado dele achando que você é melhor.", heat:1, a:false,
    exp:"Jesus falou da trave no próprio olho e contou a história do fariseu e do publicano. Todo mundo precisa da mesma graça.",
    ref:"Mt 7:1-5 · Lc 18:9-14",
    conversa:"Que tipo de pecado dos outros você tem mais facilidade de julgar?" },
  { q:"Ficar calado quando vê alguém sendo humilhado.", heat:1, a:false,
    exp:"Saber o bem e não fazer também é pecado. Às vezes defender alguém é só não deixar a pessoa sozinha.",
    ref:"Pv 31:8-9 · Tg 4:17",
    conversa:"O que te impede de se posicionar nessas horas?" },
  { q:"Dizer \"não\" a um pedido de ajuda porque você está sobrecarregado.", heat:2, a:true,
    exp:"Jesus também se retirava pra descansar e orar. Ter limite não é egoísmo, desde que não vire desculpa pra nunca ajudar.",
    ref:"Lc 5:15-16 · Gl 6:2-5",
    conversa:"Como saber se o seu \"não\" é limite saudável ou só comodismo?" },
  { q:"Baixar filme ou série pirata porque a assinatura é cara demais.", heat:3, a:false,
    exp:"Achar caro não dá direito de pegar sem pagar. Alguém trabalhou naquilo, e pegar o fruto do trabalho alheio sem permissão continua sendo roubo, mesmo digital e mesmo que \"todo mundo faça\".",
    ref:"Êx 20:15 · Rm 13:7 · Lc 16:10",
    conversa:"Por que pirataria quase não pesa na consciência, mas roubar uma loja pesaria?" },
  { q:"Trabalhar ou fazer prova no domingo.", heat:3, a:true,
    exp:"Jesus disse que o sábado foi feito pro ser humano, e não o contrário. O Novo Testamento não prende o cristão a um dia sagrado. O que continua valendo é ter ritmo de descanso e não largar a comunhão.",
    ref:"Mc 2:27 · Rm 14:5-6 · Cl 2:16",
    conversa:"Se não é o dia que importa, o que torna um tempo realmente separado pra Deus?" },
  { q:"Dizer que tá doente pra faltar no trabalho e descansar um dia.", heat:2, a:false,
    exp:"Descansar é bom e até ideia de Deus, mas conseguir isso mentindo não. Dá pra pedir folga, negociar, colocar limite. O atalho da mentira é o problema, não o descanso.",
    ref:"Pv 12:22 · Cl 3:9 · Ef 4:25",
    conversa:"Por que é tão mais fácil inventar uma desculpa do que falar \"tô esgotado\"?" },
  { q:"Comprar algo caro só porque você quer muito.", heat:3, a:true, tag:"Pode (sem virar ídolo)",
    exp:"Deus dá coisas boas pra gente desfrutar, e ter algo bom não é pecado. O problema começa quando aquilo vira segurança, status ou dono do seu coração, e quando sobra pra você e nunca sobra pra ninguém.",
    ref:"1Tm 6:17-19 · Ec 5:19 · Mt 6:19-21",
    conversa:"Como saber se uma coisa que você quer já virou ídolo?" },
  { q:"Orar pedindo coisas pra você mesmo, tipo um emprego ou um carro.", heat:1, a:true,
    exp:"Jesus mandou pedir, buscar e bater, e Paulo diz pra apresentar tudo a Deus. Pedir não é egoísmo. O que Tiago critica é pedir com motivo errado, só pra esbanjar.",
    ref:"Fp 4:6 · Mt 7:7-11 · Tg 4:3",
    conversa:"Você ora mais pedindo ou agradecendo? E quando a resposta é \"não\"?" },
  { q:"Parar de ir pra igreja porque dá pra ter fé sozinho em casa.", heat:3, a:false,
    exp:"Fé cristã nunca foi carreira solo. A Bíblia compara a igreja a um corpo: nenhuma parte sobrevive desligada das outras. Dá pra ter fé em casa, mas a gente foi feito pra crescer junto.",
    ref:"Hb 10:24-25 · At 2:42 · 1Co 12:21",
    conversa:"O que a comunidade te dá que você não consegue sozinho? E o que você dá pra ela?" },
  { q:"Falar palavrão numa roda onde ninguém liga.", heat:3, a:false,
    exp:"A Bíblia pede que da nossa boca saia o que edifica, e não palavra torpe. Não é sobre ofender alguém ali: é sobre o que a nossa fala revela e forma em nós.",
    ref:"Ef 4:29 · Cl 3:8 · Tg 3:10",
    conversa:"Palavrão é pior que uma fala educada mas cheia de veneno? Onde fica o limite?" },
  { q:"Mandar no grupo o print de uma conversa privada de alguém.", heat:1, a:false,
    exp:"Quem espalha o que foi dito em confiança trai a pessoa. Mesmo que seja engraçado ou verdade, expor alguém sem ela saber não é amar o próximo como a si mesmo.",
    ref:"Pv 11:13 · Pv 17:9 · Mt 7:12",
    conversa:"Você gostaria que o seu histórico de conversa fosse parar num grupo?" },
  { q:"Questionar o que o pastor ensinou e conferir na Bíblia.", heat:3, a:true, tag:"Pode (e deve)",
    exp:"Os bereanos foram elogiados justamente por conferir nas Escrituras o que Paulo pregava. Examinar tudo e reter o que é bom é sinal de maturidade, não de rebeldia, desde que com respeito.",
    ref:"At 17:11 · 1Ts 5:21 · 1Jo 4:1",
    conversa:"Qual a diferença entre questionar com humildade e desconfiar de tudo?" },
  { q:"Sentir inveja do sucesso de um amigo, mesmo sem fazer nada contra ele.", heat:2, a:false,
    exp:"A cobiça já está nos Dez Mandamentos, e ela acontece por dentro. Sentir a pontada é humano, mas alimentar a inveja não dá. O caminho é levar pra Deus e aprender a comemorar com quem comemora.",
    ref:"Êx 20:17 · Tg 3:16 · Rm 12:15",
    conversa:"De quem é mais difícil comemorar uma vitória: de um estranho ou de um amigo próximo?" },
  { q:"Desobedecer o governo quando ele manda negar a fé.", heat:3, a:true, tag:"Pode (e deve)",
    exp:"Pagar imposto e respeitar autoridade é o normal. Mas quando a ordem é contra Deus, os apóstolos responderam que importa obedecer antes a Deus. Daniel e os amigos dele fizeram o mesmo, aceitando as consequências.",
    ref:"At 5:29 · Dn 3:16-18 · Dn 6:10",
    conversa:"Onde fica a linha entre \"respeitar a autoridade\" e \"obedecer a Deus primeiro\" no dia a dia?" },
  { q:"Chamar a atenção de um amigo cristão que tá vivendo em pecado.", heat:3, a:true, tag:"Pode (com amor)",
    exp:"Jesus ensinou a ir falar direto com a pessoa, a sós. Paulo pede pra restaurar com mansidão, olhando pra si mesmo. Não julgar não é o mesmo que nunca falar nada: ferida de amigo é sinal de cuidado.",
    ref:"Mt 18:15 · Gl 6:1 · Pv 27:6",
    conversa:"Isso não contradiz a carta do \"não julgar\"? Qual a diferença na prática?" },
  { q:"Pegar dinheiro emprestado e não devolver porque o amigo nem cobra.", heat:1, a:false,
    exp:"O salmo chama de injusto quem pega emprestado e não paga. O amigo não cobrar é gentileza dele, não perdão da dívida. Só fica quitado se ele mesmo disser que é presente.",
    ref:"Sl 37:21 · Rm 13:8",
    conversa:"Já deixou de cobrar alguém pra não estragar a amizade? Como foi?" },
  { q:"Duvidar de Deus de vez em quando.", heat:3, a:true,
    exp:"João Batista, na prisão, mandou perguntar se Jesus era mesmo o Messias, e Jesus respondeu com carinho. Um pai disse \"eu creio, ajuda a minha falta de fé\" e foi atendido. Dúvida levada a Deus não é o fim da fé.",
    ref:"Mt 11:2-6 · Mc 9:24 · Jd 22",
    conversa:"Você se sente livre pra falar das suas dúvidas aqui na célula?" },
  { q:"Dizer \"foi o inimigo\" quando você mesmo escolheu errar.", heat:2, a:false,
    exp:"Tiago diz que cada um é tentado pelo próprio desejo. Jogar a culpa nos outros é tão antigo quanto Adão e Eva. Assumir o erro é o primeiro passo pro perdão.",
    ref:"Tg 1:14-15 · Gn 3:12-13 · 1Jo 1:9",
    conversa:"Por que é tão difícil falar só \"eu errei\", sem nenhum \"mas\"?" },
  { q:"Pedir perdão a Deus pela mesma coisa pela quinquagésima vez.", heat:2, a:true,
    exp:"Se a gente confessa, Ele é fiel pra perdoar. As misericórdias dEle se renovam toda manhã, e Jesus mandou a gente perdoar setenta vezes sete. Ele não cansa de você, só não quer que você se acomode.",
    ref:"1Jo 1:9 · Lm 3:22-23 · Mt 18:21-22",
    conversa:"Pedir perdão de novo é arrependimento ou só alívio da culpa? Como saber?" },
  { q:"Vender um celular usado sem contar o defeito que o comprador não perguntou.", heat:2, a:false,
    exp:"Esconder a verdade pra levar vantagem também é desonestidade. Balança enganosa é coisa que Deus detesta. Trate o comprador como você queria ser tratado no lugar dele.",
    ref:"Pv 11:1 · Fp 2:4 · Mt 7:12",
    conversa:"Omitir é o mesmo que mentir? Em que situações você acha que não é?" },
  { q:"Usar \"Deus me falou\" pra encerrar uma discussão.", heat:3, a:false,
    exp:"Usar o nome de Deus como trunfo pra ganhar uma conversa é tomar o nome dEle em vão. Se veio mesmo de Deus, aguenta ser conferido com a Bíblia e com irmãos maduros.",
    ref:"Êx 20:7 · Jr 23:31-32 · 1Ts 5:21",
    conversa:"Como saber se foi Deus falando ou só a sua própria vontade?" },
  { q:"Malhar e cuidar da aparência pra ficar bonito.", heat:2, a:true, tag:"Pode (com equilíbrio)",
    exp:"Cuidar do corpo tem valor, e ele é templo do Espírito. Só não dá pra colocar a autoestima ali: a beleza que Deus mais valoriza é a do coração, que não envelhece.",
    ref:"1Co 6:19-20 · 1Tm 4:8 · 1Pe 3:3-4",
    conversa:"Quando o cuidado com a aparência deixa de ser saudável?" },
  { q:"Falar \"juro por Deus\" pra convencer alguém de que é verdade.", heat:2, a:false,
    exp:"Jesus ensinou que o nosso sim deve ser sim e o nosso não, não. Se a gente precisa jurar pra ser acreditado, o problema é a confiança na nossa palavra, e o nome de Deus não é carimbo.",
    ref:"Mt 5:34-37 · Tg 5:12",
    conversa:"As pessoas acreditam na sua palavra sem você precisar jurar?" },

  /* ---------- Brasil raiz ---------- */
  { q:"Ouvir música secular, que não é gospel.", heat:3, a:true, tag:"Pode (com discernimento)",
    exp:"A Bíblia não divide música em gospel e secular. O que ela pede é encher a mente com o que é verdadeiro, puro e bom. Tem música \"do mundo\" linda e tem letra que só alimenta o que Deus quer tirar de você.",
    ref:"Fp 4:8 · 1Co 10:31 · Cl 3:17",

const ESC = { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" };
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ESC[c]);

const plural = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;

function shuffle(n) {
  const a = Array.from({ length: n }, (_, k) => k);
  for (let k = a.length - 1; k > 0; k--) {
    const j = Math.floor(Math.random() * (k + 1));
    [a[k], a[j]] = [a[j], a[k]];
  }
  return a;
}
function genCode() {
  let c = "";
  const buf = new Uint32Array(4);
  crypto.getRandomValues(buf);
  for (const x of buf) c += CODE_CHARS[x % CODE_CHARS.length];
  return c;
}
function cleanCode(v) { return String(v || "").toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4); }
function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function recall(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }

function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src; s.async = true; s.crossOrigin = "anonymous";
    s.onload = () => res();
    s.onerror = () => { s.remove(); rej(new Error("falhou: " + src)); };
    document.head.appendChild(s);
  });
}

let wakeLock = null, wantWake = false;
async function requestWake() {
  wantWake = true;
  try {
    if ("wakeLock" in navigator && document.visibilityState === "visible" && !wakeLock) {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    }
  } catch (e) { wakeLock = null; }
}
document.addEventListener("visibilitychange", () => {
  if (wantWake && document.visibilityState === "visible") requestWake();
});

const H = {
  peer: null, opened: false, tries: 0,
  conns: new Map(),      // peerId -> DataConnection
  lastSeen: new Map(),   // peerId -> timestamp
  players: [],           // {id, name, host}
  phase: "lobby", code: "", order: [], i: 0, r: 0,
  votes: new Map(),      // peerId -> boolean
  reveal: null,
  size: 20,              // cartas por rodada (líder escolhe no lobby)
  used: new Set(),       // índices de cartas já reveladas nesta sala
  timer: null, openTimer: null,
};
function sizeOptions() {
  const opts = [10, 20, 30, 40].filter((n) => n < DECK.length);
  opts.push(DECK.length);
  return opts;
}

function uniqueName(name) {
  const taken = new Set(H.players.map((p) => p.name.toLowerCase()));
  if (!taken.has(name.toLowerCase())) return name;
  let k = 2;
  while (taken.has(`${name} ${k}`.toLowerCase())) k++;
  return `${name} ${k}`;
}

function hostPublic() {
  const s = {
    phase: H.phase, code: H.code, r: H.r,
    players: H.players.map((p) => ({ id: p.id, name: p.name, host: p.host, voted: H.phase === "vote" && H.votes.has(p.id) })),
    i: H.i, total: H.order.length || DECK.length,
  };
  if (H.phase === "vote" || H.phase === "reveal") s.q = DECK[H.order[H.i]].q;
  if (H.phase === "reveal") s.reveal = H.reveal;
  return s;
}

function send(conn, msg) { try { if (conn && conn.open) conn.send(msg); } catch (e) {} }

function hostBroadcast() {
  const s = hostPublic();
  for (const [id, c] of H.conns) if (H.players.some((p) => p.id === id)) send(c, { type: "state", s });
  applyState(s);
}

function hostCreate() {
  ui.isHost = true;
  H.code = genCode();
  ui.code = H.code;
  const peer = new Peer(PEER_PREFIX + H.code);
  H.peer = peer;
  clearTimeout(H.openTimer);
  H.openTimer = setTimeout(() => {
    if (!H.opened) failHome("Não deu pra criar a sala. Confere a internet e tenta de novo.");
  }, JOIN_TIMEOUT);

  peer.on("open", (id) => {
    if (H.peer !== peer) return;
    clearTimeout(H.openTimer);
    H.opened = true;
    ui.myId = id;
    H.players = [{ id, name: ui.name, host: true }];
    H.phase = "lobby"; H.i = 0; H.votes.clear();
    H.order = shuffle(DECK.length);
    requestWake();
    clearInterval(H.timer);
    H.timer = setInterval(hostTick, PING_EVERY);
    hostBroadcast();
  });
  peer.on("connection", (conn) => {
    conn.on("open", () => { H.conns.set(conn.peer, conn); H.lastSeen.set(conn.peer, Date.now()); });
    conn.on("data", (d) => hostOnData(conn, d));
    conn.on("close", () => hostDrop(conn.peer));
    conn.on("error", () => hostDrop(conn.peer));
  });
  peer.on("disconnected", () => { if (H.peer === peer && !peer.destroyed) { try { peer.reconnect(); } catch (e) {} } });
  peer.on("error", (err) => {
    if (H.peer !== peer) return;
    if (!H.opened) {
      if (err && err.type === "unavailable-id" && H.tries < 6) {
        H.tries++;
        try { peer.destroy(); } catch (e) {}
        hostCreate();
        render();
        return;
      }
      failHome(netMessage(err, "Não deu pra criar a sala. Tenta de novo."));
    } else {
      console.warn("[host]", err && err.type, err);
    }
  });
}

function hostOnData(conn, d) {
  if (!d || typeof d !== "object") return;
  const id = conn.peer;
  H.lastSeen.set(id, Date.now());
  if (!H.conns.has(id)) H.conns.set(id, conn);
  if (d.type === "join") {
    if (H.players.some((p) => p.id === id)) { send(conn, { type: "state", s: hostPublic() }); return; }
    let name = String(d.name || "").replace(/\s+/g, " ").trim().slice(0, 20) || "Sem nome";
    H.players.push({ id, name: uniqueName(name), host: false });
    hostBroadcast();
  } else if (d.type === "vote") {
    hostVote(id, d.v);
  }
  // "ping" só atualiza lastSeen
}

function hostVote(id, v) {
  if (H.phase !== "vote") return;
  if (typeof v !== "boolean") return;
  if (!H.players.some((p) => p.id === id)) return;
  H.votes.set(id, v);
  hostBroadcast();
}

function hostDrop(id) {
  const c = H.conns.get(id);
  H.conns.delete(id);
  H.lastSeen.delete(id);
  if (c) { try { c.close(); } catch (e) {} }
  const before = H.players.length;
  H.players = H.players.filter((p) => p.id !== id || p.host);
  H.votes.delete(id);
  if (H.players.length !== before) hostBroadcast();
}

function hostTick() {
  const now = Date.now();
  for (const [id, c] of H.conns) {
    if (now - (H.lastSeen.get(id) || 0) > SILENCE_LIMIT) { hostDrop(id); continue; }
    send(c, { type: "ping" });
  }
}

/* ---------- sorteio das cartas ----------
   Cada carta tem heat (1 a 3): as mais polêmicas saem com mais frequência,
   mas ainda é sorteio. Cartas já jogadas nesta sala só voltam quando acabarem
   as inéditas, e as jogadas nos últimos encontros (salvas no aparelho do líder)
   ficam com peso bem menor. */
const HEAT_WEIGHT = { 1: 1, 2: 2.5, 3: 6 };
const RECENT_KEY = "pon-recentes";
const RECENT_KEEP = 45;      // quantas cartas jogadas lembrar entre encontros
const RECENT_PENALTY = 0.12; // peso multiplicado pra carta jogada recentemente

function recentPlayed() {
  try { const v = JSON.parse(localStorage.getItem(RECENT_KEY) || "[]"); return Array.isArray(v) ? v : []; }
  catch (e) { return []; }
}
function rememberPlayed(q) {
  const list = recentPlayed().filter((x) => x !== q);
  list.push(q);
  store(RECENT_KEY, JSON.stringify(list.slice(-RECENT_KEEP)));
}
function pickCards(size) {
  const recent = new Set(recentPlayed());
  const scored = DECK.map((c, k) => {
    let w = HEAT_WEIGHT[c.heat] || HEAT_WEIGHT[2];
    if (recent.has(c.q)) w *= RECENT_PENALTY;
    let key = Math.pow(Math.random(), 1 / w);   // sorteio ponderado sem reposição
    if (H.used.has(k)) key -= 1;                 // repetidas da sala só no fim da fila
    return { k, key };
  });
  scored.sort((a, b) => b.key - a.key);
  const chosen = scored.slice(0, Math.min(size, DECK.length)).map((x) => x.k);
  return shuffle(chosen.length).map((j) => chosen[j]);
}

function hostToLobby() {
  H.phase = "lobby";
  H.votes.clear(); H.reveal = null;
  hostBroadcast();
}

function hostStart() {
  if (H.players.length < 2) return;
  if (H.used.size >= DECK.length) H.used.clear();
  H.order = pickCards(H.size);
  H.i = 0; H.r++;
  H.votes.clear(); H.reveal = null;
  H.phase = "vote";
  hostBroadcast();
}
function hostReveal() {
  if (H.phase !== "vote") return;
  const card = DECK[H.order[H.i]];
  let pode = 0, nao = 0;
  for (const p of H.players) {
    if (!H.votes.has(p.id)) continue;
    if (H.votes.get(p.id)) pode++; else nao++;
  }
  H.reveal = { a: card.a === null ? null : !!card.a, exp: card.exp, ref: card.ref, conversa: card.conversa, pode, nao };
  if (card.tag) H.reveal.tag = card.tag;
  H.used.add(H.order[H.i]);
  rememberPlayed(card.q);
  H.phase = "reveal";
  hostBroadcast();
}
function hostNext() {
  if (H.phase !== "reveal") return;
  H.votes.clear(); H.reveal = null;
  if (H.i + 1 >= H.order.length) { H.phase = "end"; }
  else { H.i++; H.phase = "vote"; }
  hostBroadcast();
}

/* =====================================================================
   JOGADOR
   ===================================================================== */
const P = { peer: null, conn: null, joined: false, timeout: null, timer: null, lastSeen: 0 };

function playerJoin() {
  ui.isHost = false;
  const code = ui.code;
  const peer = new Peer();
  P.peer = peer;
  P.joined = false;
  clearTimeout(P.timeout);
  P.timeout = setTimeout(() => {
    if (!P.joined) failHome("A sala não respondeu. Confere o código e a internet.", "codigo");
  }, JOIN_TIMEOUT);

  peer.on("open", (id) => {
    if (P.peer !== peer) return;
    ui.myId = id;
    const conn = peer.connect(PEER_PREFIX + code, { reliable: true });
    P.conn = conn;
    conn.on("open", () => send(conn, { type: "join", name: ui.name }));
    conn.on("data", (d) => playerOnData(conn, d));
    conn.on("close", () => playerLost(conn));
    conn.on("error", () => playerLost(conn));
  });
  peer.on("disconnected", () => { if (P.peer === peer && !peer.destroyed) { try { peer.reconnect(); } catch (e) {} } });
  peer.on("error", (err) => {
    if (P.peer !== peer) return;
    if (err && err.type === "peer-unavailable") {
      if (!P.joined) failHome("Sala não encontrada. Confere o código.", "codigo");
      else playerLost(P.conn);
      return;
    }
    if (!P.joined) failHome(netMessage(err, "Não deu pra entrar na sala. Tenta de novo."));
    else console.warn("[jogador]", err && err.type, err);
  });
}

function playerOnData(conn, d) {
  if (conn !== P.conn || !d || typeof d !== "object") return;
  P.lastSeen = Date.now();
  if (d.type === "state" && d.s && typeof d.s === "object") {
    if (!P.joined) {
      P.joined = true;
      clearTimeout(P.timeout);
      requestWake();
      clearInterval(P.timer);
      P.timer = setInterval(() => {
        if (Date.now() - P.lastSeen > SILENCE_LIMIT) { playerLost(P.conn); return; }
        send(P.conn, { type: "ping" });
      }, PING_EVERY);
    }
    applyState(d.s);
  }
}

function playerLost(conn) {
  if (conn && conn !== P.conn) return;
  if (P.joined) failHome("A conexão com a sala caiu (o líder pode ter saído).");
  else failHome("Não deu pra entrar na sala. Confere o código.", "codigo");
}

function castVote(v) {
  const s = ui.s;
  if (!s || s.phase !== "vote") return;
  ui.myVote = v;
  if (ui.isHost) hostVote(ui.myId, v);
  else { send(P.conn, { type: "vote", v }); updateScreen(); }
}

/* =====================================================================
   Comum
   ===================================================================== */
function netMessage(err, fallback) {
  const t = err && err.type;
  if (t === "browser-incompatible") return "Esse navegador não suporta o jogo. Tenta pelo Chrome ou Safari atualizado.";
  if (t === "network" || t === "server-error" || t === "socket-error" || t === "socket-closed") return "Sem conexão com o servidor. Confere a internet e tenta de novo.";
  return fallback;
}

function teardown() {
  clearTimeout(P.timeout); clearInterval(P.timer);
  clearTimeout(H.openTimer); clearInterval(H.timer);
  const pp = P.peer, hp = H.peer;
  P.peer = null; P.conn = null; P.joined = false;
  H.peer = null; H.opened = false; H.tries = 0;
  H.conns.clear(); H.lastSeen.clear(); H.players = []; H.votes.clear(); H.used.clear(); H.reveal = null; H.phase = "lobby";
  try { pp && pp.destroy(); } catch (e) {}
  try { hp && hp.destroy(); } catch (e) {}
  if (wakeLock) { try { wakeLock.release(); } catch (e) {} }
  wakeLock = null; wantWake = false;
  ui.s = null; ui.myVote = null; ui.voteKey = null; ui.myId = null;
}

function failHome(msg, field = "") {
  teardown();
  ui.screen = "home";
  if (ui.isHost) ui.code = HAS_PRESET ? PRESET : "";
  ui.isHost = false;
  ui.err = msg; ui.errField = field;
  render();
}

function applyState(s) {
  const key = `${s.r}-${s.i}`;
  if (key !== ui.voteKey) { ui.voteKey = key; ui.myVote = null; }
  if (s.phase !== "vote") ui.myVote = null;
  ui.s = s;
  ui.screen = "game";
  render();
}

window.addEventListener("pagehide", () => {
  try { H.peer && H.peer.destroy(); } catch (e) {}
  try { P.peer && P.peer.destroy(); } catch (e) {}
});

/* =====================================================================
   Versículos: toca na referência e abre o texto (Almeida, domínio público)
   ===================================================================== */
const BOOKS = {
  "Gn":["GEN","Gênesis"], "Êx":["EXO","Êxodo"], "Ex":["EXO","Êxodo"], "Lv":["LEV","Levítico"], "Nm":["NUM","Números"], "Dt":["DEU","Deuteronômio"],
  "Js":["JOS","Josué"], "Jz":["JDG","Juízes"], "Rt":["RUT","Rute"], "1Sm":["1SA","1 Samuel"], "2Sm":["2SA","2 Samuel"], "1Rs":["1KI","1 Reis"], "2Rs":["2KI","2 Reis"],
  "Ne":["NEH","Neemias"], "Et":["EST","Ester"], "Jó":["JOB","Jó"], "Sl":["PSA","Salmo"], "Pv":["PRO","Provérbios"], "Ec":["ECC","Eclesiastes"], "Ct":["SNG","Cânticos"],
  "Is":["ISA","Isaías"], "Jr":["JER","Jeremias"], "Lm":["LAM","Lamentações"], "Ez":["EZK","Ezequiel"], "Dn":["DAN","Daniel"], "Os":["HOS","Oseias"], "Am":["AMO","Amós"],
  "Jn":["JON","Jonas"], "Mq":["MIC","Miqueias"], "Hc":["HAB","Habacuque"], "Ml":["MAL","Malaquias"],
  "Mt":["MAT","Mateus"], "Mc":["MRK","Marcos"], "Lc":["LUK","Lucas"], "Jo":["JHN","João"], "At":["ACT","Atos"], "Rm":["ROM","Romanos"],
  "1Co":["1CO","1 Coríntios"], "2Co":["2CO","2 Coríntios"], "Gl":["GAL","Gálatas"], "Ef":["EPH","Efésios"], "Fp":["PHP","Filipenses"], "Cl":["COL","Colossenses"],
  "1Ts":["1TH","1 Tessalonicenses"], "2Ts":["2TH","2 Tessalonicenses"], "1Tm":["1TI","1 Timóteo"], "2Tm":["2TI","2 Timóteo"], "Tt":["TIT","Tito"], "Fm":["PHM","Filemom"],
  "Hb":["HEB","Hebreus"], "Tg":["JAS","Tiago"], "1Pe":["1PE","1 Pedro"], "2Pe":["2PE","2 Pedro"], "1Jo":["1JN","1 João"], "2Jo":["2JN","2 João"], "3Jo":["3JN","3 João"],
  "Jd":["JUD","Judas"], "Ap":["REV","Apocalipse"],
};
const ONE_CHAPTER = new Set(["OBA", "PHM", "2JN", "3JN", "JUD"]);

function parseRef(txt) {
  const m = String(txt).trim().match(/^(\d?\s?\S+?)\s*(\d+)(?::([\d,\-\s]+))?$/);
  if (!m) return null;
  const book = BOOKS[m[1].replace(/\s/g, "")];
  if (!book) return null;
  let chap = Number(m[2]), spec = m[3] ? m[3].replace(/\s/g, "") : "";
  if (!spec && ONE_CHAPTER.has(book[0])) { spec = String(chap); chap = 1; }
  let verses = null;
  if (spec) {
    verses = new Set();
    for (const part of spec.split(",")) {
      const [a, b] = part.split("-").map(Number);
      for (let v = a; v <= (b || a); v++) verses.add(v);
    }
  }
  const first = spec ? spec.split(",")[0] : "";
  return {
    txt, usfm: book[0], chap, verses,
    title: `${book[1]} ${m[2]}${m[3] ? ":" + m[3] : ""}`,
    nvi: `https://www.bible.com/bible/129/${book[0]}.${chap}${first ? "." + first : ""}.NVI`,
  };
}

const chapterCache = new Map();
function fetchChapter(usfm, chap) {
  const k = `${usfm}/${chap}`;
  if (!chapterCache.has(k)) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 12000);
    const get = () => fetch(`https://bible-api.com/data/almeida/${k}`, { signal: ctrl.signal })
      .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); });
    const p = get()
      .catch((e) => { if (ctrl.signal.aborted) throw e; return new Promise((ok) => setTimeout(ok, 2500)).then(get); })
      .then((j) => j.verses || [])
      .finally(() => clearTimeout(t));
    p.catch(() => chapterCache.delete(k));
    chapterCache.set(k, p);
  }
  return chapterCache.get(k);
}

const vs = { refs: [], k: 0, seq: 0 };
const vsheet = $("#vsheet");

function openVerses(k) {
  const raw = String((ui.s && ui.s.reveal && ui.s.reveal.ref) || "").split("·").map((x) => x.trim()).filter(Boolean);
  vs.refs = raw.map((x) => parseRef(x) || { txt: x, title: x, bad: true, nvi: `https://www.bible.com/pt/search/bible?q=${encodeURIComponent(x)}` });
  if (!vs.refs.length) return;
  $("#vtabs").innerHTML = vs.refs.length > 1
    ? vs.refs.map((r, i) => `<button type="button" role="tab" data-tab="${i}" aria-selected="false">${esc(r.txt)}</button>`).join("")
    : "";
  $("#vtabs").hidden = vs.refs.length < 2;
  showVerse(k);
  if (!vsheet.open) { try { vsheet.showModal(); } catch (e) { vsheet.setAttribute("open", ""); } }
}

async function showVerse(k) {
  vs.k = Math.max(0, Math.min(k, vs.refs.length - 1));
  const r = vs.refs[vs.k], seq = ++vs.seq;
  $("#vtitle").textContent = r.title.toUpperCase();
  $("#vlink").href = r.nvi;
  for (const b of document.querySelectorAll("#vtabs [data-tab]")) {
    const on = Number(b.dataset.tab) === vs.k;
    b.setAttribute("aria-selected", String(on));
    if (on) b.scrollIntoView({ block: "nearest", inline: "nearest" });
  }
  const body = $("#vbody");
  body.scrollTop = 0;
  if (r.bad) { body.innerHTML = `<p class="msg">Não reconheci essa referência. Toca em "Ler na NVI" pra procurar.</p>`; return; }
  body.innerHTML = `<p class="msg">Abrindo a Bíblia…</p>`;
  try {
    const all = await fetchChapter(r.usfm, r.chap);
    if (seq !== vs.seq) return;
    const list = all.filter((v) => !r.verses || r.verses.has(v.verse));
    if (!list.length) throw new Error("vazio");
    let prev = null, html = "";
    for (const v of list) {
      if (prev !== null && v.verse !== prev + 1) html += `<p class="msg" aria-hidden="true">…</p>`;
      html += `<p><sup>${v.verse}</sup>${esc(String(v.text).replace(/\s+/g, " ").trim())}</p>`;
      prev = v.verse;
    }
    body.innerHTML = html;
  } catch (e) {
    if (seq !== vs.seq) return;
    body.innerHTML = `<p class="msg">Não deu pra carregar o texto agora (sem internet?). Toca em "Ler na NVI" pra abrir no app da Bíblia.</p>`;
  }
}

function closeVerses() { if (vsheet.open) { try { vsheet.close(); } catch (e) { vsheet.removeAttribute("open"); } } }

vsheet.addEventListener("click", (e) => {
  if (e.target === vsheet || e.target.closest("[data-close]")) return closeVerses();
  const tab = e.target.closest("[data-tab]");
  if (tab) showVerse(Number(tab.dataset.tab));
});
vsheet.addEventListener("keydown", (e) => {
  if (vs.refs.length < 2 || !e.target.closest("[data-tab]")) return;
  if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
    e.preventDefault();
    showVerse((vs.k + (e.key === "ArrowRight" ? 1 : vs.refs.length - 1)) % vs.refs.length);
    document.querySelector(`#vtabs [data-tab="${vs.k}"]`).focus();
  }
});

function render() {
  const key = screenKey();
  if (key !== lastKey) {
    const prev = lastKey;
    lastKey = key;
    closeVerses();
    const n = screenName();
    app.innerHTML = BUILD[n]();
    AFTER[n] && AFTER[n](prev);
    window.scrollTo(0, 0);

  updateScreen();
}

// Uma frase pra puxar o debate, conforme o jeito que a célula votou
function spark(r) {
  const tot = r.pode + r.nao;
  const certos = r.a ? r.pode : r.nao;
  let msg;
  if (r.a === null) msg = tot === 0 ? "Essa divide até cristão maduro. Bora ouvir os dois lados?" : "Essa divide até cristão maduro. Cada lado defende seu voto, com a Bíblia na mão!";
  else if (tot === 0) msg = "Ninguém votou nessa. Bora ouvir o que cada um teria votado?";
  else if (certos === 0) msg = "A célula inteira votou contra a resposta! Por que será que parece tão certo o outro lado?";
  else if (certos === tot) msg = tot === 1 ? "Na teoria tá fácil. E na prática, alguém tropeça nessa?" : "Unanimidade! Mas na prática, quem aqui vive isso sem tropeçar?";
  else if (certos * 2 < tot) msg = "A maioria foi pro outro lado. Quem votou diferente, defende seu voto!";
  else msg = "Deu divergência! Quem votou diferente da resposta, conta o porquê.";
  return `<div class="spark">${I.bubble("#F5E52E", 20)}<span>${esc(msg)}</span></div>`;
}

    return `<main class="screen">
      ${mascot("pao", "width:92px;height:92px;left:-20px;bottom:120px;transform:rotate(-16deg)")}
      <header class="top">${brand()}</header>
      <div class="center">
        <div class="spin-wrap"><div class="under"></div>${backCard("spin")}</div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center">
          <h1 class="big-label" style="margin:0">${ui.isHost ? "CRIANDO A SALA" : "ENTRANDO NA SALA"}</h1>
          ${ui.code && !ui.isHost ? codeCards(ui.code, "sm") : ""}
          <div class="dots" role="status" style="margin-top:8px"><span>Embaralhando as cartas</span><i></i><i></i><i></i></div>
        </div>
      </div>
      <p class="foot">Se demorar mais de 12 segundos, a gente avisa.</p>
    </main>`;
  },

  lobby() {
    const s = ui.s;
    if (ui.isHost) {
      const link = roomLink(s.code);
      const shown = `${location.host}${location.pathname.replace(/\/$/, "")}`;
      return `<main class="screen">
        <header class="top">${brand()}<span class="badge">${I.crown(14, false)}LÍDER</span></header>
        <div class="code-block">
          <div>
            <span class="label-sm">CÓDIGO DA SALA</span>
            <div aria-label="Código ${esc(s.code.split("").join(" "))}" role="img">${codeCards(s.code)}</div>
          </div>
          <svg class="opt" viewBox="0 0 64 64" style="width:72px;height:72px;margin-right:-6px;transform:rotate(10deg)" aria-hidden="true"><use href="#m-peixe"/></svg>
        </div>
        <section class="card qr-card">
          <div class="qr" id="qr" role="img" aria-label="QR code da sala ${esc(s.code)}"></div>
          <div class="qr-txt">
            <b>APONTA A CÂMERA</b>
            <span>Ou abre o link e o código já vem preenchido:</span>
            <a href="${esc(link)}" target="_blank" rel="noopener">${esc(shown)}<br>/?sala=${esc(s.code)}</a>
          </div>
        </section>
        <div class="row-between" style="margin-top:24px"><span class="label">CARTAS NA RODADA</span><span class="muted">${DECK.length} no baralho</span></div>
        <p class="hint" style="text-align:left;margin-top:6px;font-size:13px">As mais polêmicas aparecem mais, e as que já saíram nos últimos encontros ficam pro fim da fila.</p>
        <div class="seg" style="grid-template-columns:repeat(${sizeOptions().length},minmax(0,1fr))" role="group" aria-label="Quantas cartas nesta rodada">
          ${sizeOptions().map((n) => `<button type="button" data-act="size" data-n="${n}" aria-pressed="false">${n === DECK.length ? "TODAS" : n}</button>`).join("")}
        </div>
        <div class="row-between" style="margin-top:22px"><span class="label">NA MESA</span><span class="muted" id="count"></span></div>
        <div class="chips" id="chips" style="margin-top:12px"></div>
        <div class="push" style="padding-top:24px;display:flex;flex-direction:column;gap:14px">
          <div class="tip">${I.phone}<span>Deixe esta tela aberta. Se ela fechar, a sala cai.</span></div>
          <button class="btn btn-dark btn-big" type="button" data-act="start" id="start">COMEÇAR</button>
          <p class="hint" id="startHint"></p>
        </div>
      </main>`;
    }
    return `<main class="screen">
      ${mascot("uva", "width:80px;height:80px;left:-16px;top:150px;transform:rotate(18deg)")}
      ${mascot("ovelha", "width:96px;height:96px;right:-22px;top:300px;transform:rotate(-18deg)")}
      <header class="top">${brand()}<span class="code-xs" aria-label="Sala ${esc(s.code)}">SALA ${codeCards(s.code, "")}</span></header>
      <div style="margin-top:44px;display:flex;justify-content:center">
        <div class="stack3" aria-hidden="true">${backCard("b1")}${backCard("b2")}${backCard("b3")}</div>
      </div>
      <div style="margin-top:40px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center">
        <h1 class="big-label" style="margin:0;letter-spacing:.1em">VOCÊ TÁ NA MESA</h1>
        <div class="dots" style="font-size:16px"><span>Esperando o líder começar</span><i></i><i></i><i></i></div>
      </div>
      <div class="push" style="padding-top:28px;display:flex;flex-direction:column;gap:12px">
        <div class="row-between"><span class="label">NA MESA</span><span class="muted" id="count"></span></div>
        <div class="chips" id="chips"></div>
      </div>
    </main>`;
  },

  vote() {
    const s = ui.s;
    const pet = MASCOTS[s.i % MASCOTS.length];
    return `<main class="screen">
      <header class="top">${brand()}${topCount(s)}</header>
      ${progress(s)}
      <div class="deck">
        <div class="s1" aria-hidden="true"></div><div class="s2" aria-hidden="true"></div>
        <article class="card qcard deal" aria-labelledby="qtext">
          <div class="qhead"><span class="qnum">SITUAÇÃO ${pad2(s.i + 1)}</span>${eagle("ink")}</div>
          <p class="qtext" id="qtext">${esc(s.q)}</p>
          ${mascot(pet, "")}
        </article>
      </div>
      <section class="votes" aria-label="Quem já votou">
        <div class="row-between"><span class="label" id="votecount"></span><span class="note">ninguém vê o seu voto</span></div>
        <div class="chips" id="chips" style="gap:6px"></div>
      </section>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <div class="hand-row" role="group" aria-label="Seu voto">
        <button class="hand p" type="button" data-act="vote" data-v="1" aria-pressed="false"><span class="ic">${I.check("#34C27A")}</span><span class="tx">PODE</span></button>
        <button class="hand n" type="button" data-act="vote" data-v="0" aria-pressed="false"><span class="ic">${I.x("#C61F32")}</span><span class="tx">NÃO PODE</span></button>
      </div>
      ${ui.isHost ? `<div class="vote-actions"><button class="btn btn-dark" type="button" data-act="reveal">${I.eye}REVELAR</button></div>` : ""}
    </main>`;
  },

  reveal() {
    const s = ui.s, r = s.reveal;
    const kind = r.a === null ? "d" : r.a ? "p" : "n";
    const label = r.tag ? r.tag.toUpperCase() : ({ p: "PODE", n: "NÃO PODE", d: "DEPENDE" })[kind];
    const tot = r.pode + r.nao;
    const pp = tot ? (r.pode / tot) * 100 : 0, pn = tot ? (r.nao / tot) * 100 : 0;
    const refs = String(r.ref || "").split("·").map((x) => x.trim()).filter(Boolean);
    const last = s.i + 1 >= s.total;
    const actions = ui.isHost
      ? `<div class="reveal-actions">
          <button class="btn btn-dark" type="button" data-act="next">${last ? "FINALIZAR" : "PRÓXIMA CARTA"}${I.arrow}</button>
          <p class="hint">Os outros veem: "Hora de conversar! O líder passa pra próxima."</p>
        </div>`
      : `<div class="talk-now">${I.bubble("#F5E52E", 22)}<span>Hora de conversar! O líder passa pra próxima.</span></div>`;
    return `<main class="screen wide">
      <header class="top">${brand()}${topCount(s)}</header>
      ${progress(s)}
      <div class="reveal-grid">
        <article class="card rcard flip" aria-labelledby="ans">
          <div class="banner ${kind}">
            <span class="ic">${kind === "p" ? I.check("#34C27A", 22) : kind === "n" ? I.x("#C61F32", 22) : I.depends}</span>
            <b id="ans" class="${label.length > 9 ? "long" : ""}">${esc(label)}</b>
          </div>
          <div class="rbody">
            <div class="rq"><span class="qnum">SITUAÇÃO ${pad2(s.i + 1)}</span><span>${esc(s.q)}</span></div>
            <p class="exp">${esc(r.exp)}</p>
            <div class="refs" aria-label="Referências bíblicas">${I.book}${refs.map((x, k) => `<button type="button" data-act="verse" data-k="${k}" aria-haspopup="dialog">${esc(x)}</button>`).join("")}</div>
            <p class="refs-hint">Toca no versículo pra ler o texto.</p>
            <div class="talk"><b>${I.bubble()}PRA CONVERSAR</b><span>${esc(r.conversa)}</span></div>
          </div>
        </article>
        <div class="side">
          <section class="result" aria-label="Como a célula votou">
            <span class="label">COMO A CÉLULA VOTOU</span>
            <div class="bars">
              <span class="bl">${I.check("#34C27A", 16)}PODE</span>
              <div class="track" role="img" aria-label="${plural(r.pode, "voto", "votos")} em pode"><i class="fp grow${pp > 0 && pp < 100 ? " on" : ""}" style="width:${pp}%"></i></div>
              <span class="num">${r.pode}</span>
              <span class="bl">${I.x("#FFFFFF", 16)}NÃO PODE</span>
              <div class="track" role="img" aria-label="${plural(r.nao, "voto", "votos")} em não pode"><i class="fn grow${pn > 0 && pn < 100 ? " on" : ""}" style="width:${pn}%"></i></div>
              <span class="num">${r.nao}</span>
            </div>
            ${spark(r)}
          </section>
          ${actions}
        </div>
      </div>
    </main>`;
  },

  end() {
    const s = ui.s;
    return `<main class="screen">
      ${mascot("ovelha", "width:86px;height:86px;left:-18px;bottom:150px;transform:rotate(14deg)")}
      ${mascot("uva", "width:80px;height:80px;right:-12px;bottom:170px;transform:rotate(-12deg)")}
      <header class="top">${brand()}<span class="top-count">${s.total} <span>DE ${s.total}</span></span></header>
      <div class="end-wrap">
        <div class="s1" aria-hidden="true"></div><div class="s2" aria-hidden="true"></div>
        <div class="card end-card">
          <svg class="pet" viewBox="0 0 64 64" aria-hidden="true"><use href="#m-pomba"/></svg>
          <h1>FIM DE<br>JOGO!</h1>
          <span class="bar" aria-hidden="true"></span>
          <p class="pray">Bora orar juntos?</p>
          <p class="sum" id="endinfo"></p>
        </div>
      </div>
      <div class="end-actions">
        ${ui.isHost
          ? `<button class="btn btn-dark" type="button" data-act="again" id="again">${I.reload}JOGAR DE NOVO</button>
             <button class="btn btn-sec" type="button" data-act="lobby">VOLTAR PRA SALA</button>
             <p class="hint" id="againHint">Reembaralha e mantém a mesma galera.</p>`
          : `<p class="hint">Se o líder quiser, ele começa outra rodada daqui.</p>`}
      </div>
    </main>`;
  },
};

const AFTER = {
  home() {
    const code = $("#codigo");
    code.addEventListener("input", () => {
      const v = cleanCode(code.value);
      if (code.value !== v) code.value = v;
      if (ui.errField === "codigo") setErr("");
    });
    $("#nome").addEventListener("input", () => { if (ui.errField === "nome") setErr(""); });
    $("#joinForm").addEventListener("submit", (e) => { e.preventDefault(); startConnecting("join"); });
  },
  lobby() {
    if (!ui.isHost) return;
    const el = $("#qr"), code = ui.s.code;
    qrReady.then((ok) => {
      if (!ok || !el.isConnected) { if (el.isConnected) el.innerHTML = `<span style="font-size:12px;font-weight:600;text-align:center;color:#4A5170">QR indisponível. Usa o link.</span>`; return; }
      el.innerHTML = "";
      new QRCode(el, { text: roomLink(code), width: 264, height: 264, colorDark: "#0B1026", colorLight: "#FFFFFF", correctLevel: QRCode.CorrectLevel.M });
      el.removeAttribute("title");
    });
  },
};

const UPDATE = {
  home() {
    const err = $("#err");
    err.innerHTML = ui.err ? `${I.alert}<span>${esc(ui.err)}</span>` : "";
    $("#nome").classList.toggle("bad", ui.errField === "nome");
    $("#codigo").classList.toggle("bad", ui.errField === "codigo");
    $("#nome").setAttribute("aria-invalid", ui.errField === "nome");
    $("#codigo").setAttribute("aria-invalid", ui.errField === "codigo");
  },
  lobby() {
    const ps = playersOf(ui.s);
    $("#count").textContent = plural(ps.length, "pessoa", "pessoas");
    $("#chips").innerHTML = ps.map(chip).join("");
    if (ui.isHost) {
      const ok = ps.length >= 2;
      $("#start").disabled = !ok;
      $("#startHint").textContent = ok ? `Dá uns ${Math.round(H.size * 1.5)} a ${H.size * 2} minutos de conversa.` : "Espera pelo menos mais uma pessoa entrar.";
      for (const b of document.querySelectorAll("[data-act=size]")) b.setAttribute("aria-pressed", String(Number(b.dataset.n) === H.size));
    }
  },
  vote() {
    const s = ui.s, ps = playersOf(s);
    const voted = ps.filter((p) => p.voted).length;
    $("#votecount").textContent = `${voted} DE ${ps.length} VOTARAM`;
    $("#chips").innerHTML = ps.map(vchip).join("");
    const st = $("#status");
    const has = ui.myVote !== null;
    st.textContent = has ? "Voto registrado. Dá pra mudar até revelar." : "Vote! Dá pra mudar até revelar.";
    st.classList.toggle("ok", has);
    for (const b of document.querySelectorAll(".hand")) {
      const v = b.dataset.v === "1";
      const on = has && ui.myVote === v;
      b.setAttribute("aria-pressed", String(on));
      b.classList.toggle("picked", on);
      b.classList.toggle("dim", has && !on);
    }
  },
  end() {
    const s = ui.s;
    $("#endinfo").textContent = `${plural(s.total, "carta", "cartas")}, ${plural(s.players.length, "pessoa", "pessoas")} na mesa. Valeu, Aquila.`;
    if (ui.isHost) {
      const ok = s.players.length >= 2;
      $("#again").disabled = !ok;
      $("#againHint").textContent = ok
        ? `Jogar de novo traz ${plural(H.size, "carta nova", "cartas novas")} com a mesma galera. Na sala você muda a quantidade.`
        : "Precisa de pelo menos 2 pessoas na mesa.";
    }
  },
};

app.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === "create") startConnecting("host");
  else if (act === "vote") castVote(b.dataset.v === "1");
  else if (act === "verse") openVerses(Number(b.dataset.k));
  else if (act === "start" && ui.isHost) hostStart();
  else if (act === "size" && ui.isHost) { H.size = Number(b.dataset.n) || 20; updateScreen(); }
  else if (act === "reveal" && ui.isHost) hostReveal();
  else if (act === "next" && ui.isHost) hostNext();
  else if (act === "again" && ui.isHost) hostStart();
  else if (act === "lobby" && ui.isHost) hostToLobby();
});

render();
</script>
</body>
</html>
